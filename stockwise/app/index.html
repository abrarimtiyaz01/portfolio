<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockWise – Weekly Stock Count</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d8;--ac:#0f7b5f;--dg:#b42318;--wn:#a16207;--ok:#0f7b5f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#f1efe8;--mu:#a09e94;--bd:#33322e;--ac:#34b48f;--dg:#f97066;--wn:#facc15;--ok:#34b48f}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#f1efe8;--mu:#a09e94;--bd:#33322e;--ac:#34b48f;--dg:#f97066;--wn:#facc15;--ok:#34b48f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:600px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.tabs{display:flex;gap:5px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:4px 0;z-index:5}
.tab{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:13px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nt{color:var(--mu);font-size:12.5px}.b{font-weight:600}
input,select,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.sm{width:78px;text-align:center;padding:8px 4px}
button{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button.pr{background:var(--ac);color:#fff;border-color:var(--ac)}button.dg{color:var(--dg)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.low{color:var(--dg);border-color:var(--dg)}.soon{color:var(--wn);border-color:var(--wn)}.good{color:var(--ok);border-color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--bd);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.hd{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.hd input{flex:1}
.em{text-align:center;color:var(--mu);padding:26px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.k{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.diff{font-size:12px;min-width:90px;text-align:right}
</style>
</head>
<body>
<div class="w">
  <h1>StockWise</h1>
  <p class="sub">Count your shelves once a week. The app compares with last time, learns how fast each item sells, and tells you what to buy.</p>
  <div class="tabs">
    <button class="tab on" id="t-count" onclick="go('count')">Count</button>
    <button class="tab" id="t-buy" onclick="go('buy')">Buy</button>
    <button class="tab" id="t-fast" onclick="go('fast')">Fast sellers</button>
    <button class="tab" id="t-items" onclick="go('items')">Items</button>
  </div>
  <div id="v"></div>
</div>
<script>
var K='stockwise_v1',S={items:[],counts:[],set:{cw:2,ld:3}},tab='count';
function load(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.items)S=d}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dn(d){return Date.parse(d+'T00:00:00Z')/864e5}
function num(x){var n=parseFloat(x);return isNaN(n)?null:n}
function fmt(n){return n==null?'–':(Math.round(n*10)/10).toString()}
function go(t){tab=t;['count','buy','fast','items'].forEach(function(x){document.getElementById('t-'+x).className='tab'+(x===t?' on':'')});render()}

/* ---- learning engine ---- */
function series(id){var p=[];S.counts.forEach(function(c){if(c.q[id]!=null)p.push({d:c.date,q:c.q[id],a:(c.a&&c.a[id])||0})});return p}
function stats(it){
  var p=series(it.id),rates=[],i;
  for(i=1;i<p.length;i++){
    var days=Math.max(1,dn(p[i].d)-dn(p[i-1].d)),sold=p[i-1].q+p[i].a-p[i].q;
    rates.push(Math.max(0,sold)/days);
  }
  var last=p.length?p[p.length-1].q:null,rate=null,trend='new';
  if(rates.length){
    var r=rates.slice(-4),w=0,s=0;
    r.forEach(function(x,j){s+=x*(j+1);w+=j+1});rate=s/w;trend='steady';
    if(rates.length>=2){
      var prev=rates.slice(Math.max(0,rates.length-4),rates.length-1),pm=prev.reduce(function(a,b){return a+b},0)/prev.length,lr=rates[rates.length-1];
      trend=pm===0?(lr>0?'rising':'steady'):(lr/pm>1.25?'rising':(lr/pm<0.75?'falling':'steady'));
    }
  }
  var ld=S.set.ld,cw=S.set.cw,min=it.min;
  var out=last===0,below=min!=null&&last!=null&&last<=min;
  var rop=rate!=null?rate*(ld+3):0,soon=rate>0&&last!=null&&last<=rop;
  var left=(rate>0&&last!=null)?last/rate:null;
  var target=rate!=null?rate*(cw*7+ld):0,sug=0;
  if(last!=null&&(out||below||soon)){sug=Math.ceil(Math.max(target-last,min!=null?min*2-last:0,1))}
  var why=out?'Out of stock':(below?'Below your level':(soon?'About '+Math.max(1,Math.round(left))+' days left':''));
  return{last:last,rate:rate,week:rate!=null?rate*7:null,trend:trend,left:left,need:!!why,sug:sug,why:why,out:out,below:below,n:p.length,lastDate:p.length?p[p.length-1].d:null};
}
function all(){return S.items.map(function(it){return{it:it,s:stats(it)}})}

/* ---- views ---- */
function render(){
  var v=document.getElementById('v');
  if(tab==='count')v.innerHTML=vCount();
  else if(tab==='buy')v.innerHTML=vBuy();
  else if(tab==='fast')v.innerHTML=vFast();
  else v.innerHTML=vItems();
}
function vCount(){
  if(!S.items.length)return '<div class="em">No items yet.<br>Go to <b>Items</b> to add them, or load sample data.<br><br><button class="pr" onclick="demo()">Load sample data</button></div>';
  var last=S.counts.length?S.counts[S.counts.length-1].date:null;
  var h='<div class="hd"><span class="nt">Count date</span><input type="date" id="cd" value="'+today()+'"></div>';
  h+='<p class="nt">Enter what is on the shelf now. Use “received” only if you bought stock since the last count. Leave an item empty to skip it.'+(last?' Last count: '+esc(last)+'.':'')+'</p>';
  S.items.forEach(function(it){
    var s=stats(it);
    h+='<div class="cd"><div class="r"><div><span class="b">'+esc(it.name)+'</span> <span class="nt">'+esc(it.unit||'')+'</span><div class="nt">Last: '+fmt(s.last)+(s.week!=null?' · sells ~'+fmt(s.week)+'/wk':'')+'</div></div>'
     +'<div style="display:flex;gap:6px"><div><label class="k">Now</label><input class="sm" type="number" inputmode="decimal" id="q-'+it.id+'" oninput="live(\''+it.id+'\')"></div>'
     +'<div><label class="k">Received</label><input class="sm" type="number" inputmode="decimal" id="a-'+it.id+'" oninput="live(\''+it.id+'\')"></div></div></div>'
     +'<div class="diff nt" id="d-'+it.id+'"></div></div>';
  });
  h+='<div class="r" style="gap:8px"><button class="pr" style="flex:1;padding:12px" onclick="saveCount()">Save this week’s count</button>'+(S.counts.length?'<button class="dg" onclick="undo()">Undo last</button>':'')+'</div>';
  return h;
}
function live(id){
  var it=S.items.filter(function(x){return x.id===id})[0],s=stats(it),q=num(document.getElementById('q-'+id).value),a=num(document.getElementById('a-'+id).value)||0,el=document.getElementById('d-'+id);
  if(q==null||s.last==null){el.textContent='';return}
  var sold=s.last+a-q;
  el.textContent=sold>=0?'Sold since last count: '+fmt(sold):'Stock went up by '+fmt(-sold)+' – add it under “Received”?';
  el.style.color=sold<0?'var(--wn)':'';
}
function saveCount(){
  var d=document.getElementById('cd').value||today(),q={},a={},n=0;
  S.items.forEach(function(it){
    var qv=num(document.getElementById('q-'+it.id).value);
    if(qv!=null){q[it.id]=qv;n++;var av=num(document.getElementById('a-'+it.id).value);if(av)a[it.id]=av}
  });
  if(!n){alert('Enter at least one quantity');return}
  S.counts=S.counts.filter(function(c){return c.date!==d});
  S.counts.push({date:d,q:q,a:a});S.counts.sort(function(x,y){return x.date<y.date?-1:1});
  save();go('buy');
}
function undo(){if(confirm('Remove the most recent count?')){S.counts.pop();save();render()}}
function vBuy(){
  var L=all().filter(function(x){return x.s.need}).sort(function(a,b){return (a.s.left==null?-1:a.s.left)-(b.s.left==null?-1:b.s.left)});
  if(!S.counts.length)return '<div class="em">Do your first count to get a buy list.</div>';
  if(!L.length)return '<div class="em">Nothing urgent to buy. 🎉<br>Everything is above its level.</div>';
  var h='<p class="nt">Suggested quantity covers about '+S.set.cw+' weeks of sales plus '+S.set.ld+' days delivery time. After 2 or more counts the app uses learned sales speed; before that only your manual level.</p>',txt='Order list:\n';
  L.forEach(function(x){
    var u=x.it.unit?' '+x.it.unit:'';txt+='• '+x.it.name+' – '+x.s.sug+u+'\n';
    h+='<div class="cd"><div class="r"><div><span class="b">'+esc(x.it.name)+'</span><div class="nt">Now '+fmt(x.s.last)+u+(x.s.week!=null?' · sells ~'+fmt(x.s.week)+'/wk':'')+'</div></div>'
     +'<div style="text-align:right"><div class="b">Buy '+x.s.sug+esc(u)+'</div><span class="pill '+(x.s.out||x.s.below?'low':'soon')+'">'+esc(x.s.why)+'</span></div></div></div>';
  });
  return h+'<textarea id="bt" rows="'+(L.length+2)+'" readonly>'+esc(txt)+'</textarea><div class="r" style="margin-top:8px;gap:8px"><button style="flex:1" onclick="cp()">Copy list</button><a href="https://wa.me/?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener" style="flex:1;text-align:center;padding:9px;border-radius:8px;background:#1faa59;color:#fff;text-decoration:none;font-size:13px">Send on WhatsApp</a></div>';
}
function cp(){var t=document.getElementById('bt');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}}
function vFast(){
  var L=all().filter(function(x){return x.s.rate!=null}).sort(function(a,b){return b.s.rate-a.s.rate});
  if(!L.length)return '<div class="em">Sales speed appears after your second count.</div>';
  var mx=Math.max.apply(null,L.map(function(x){return x.s.week}))||1,ar={rising:'↑ rising',falling:'↓ slowing',steady:'→ steady',"new":''};
  var h='<p class="nt">Ranked by units sold per week (learned from your counts; recent weeks count more).</p>';
  L.forEach(function(x,i){
    var c=x.s.trend==='rising'?'good':(x.s.trend==='falling'?'soon':'');
    h+='<div class="cd"><div class="r"><div><span class="b">'+(i+1)+'. '+esc(x.it.name)+'</span><div class="nt">'+fmt(x.s.week)+' '+esc(x.it.unit||'units')+'/week'+(x.s.left!=null?' · stock lasts ~'+Math.round(x.s.left)+' days':'')+'</div></div><span class="pill '+c+'">'+ar[x.s.trend]+'</span></div>'
     +'<div class="bar"><i style="width:'+Math.max(2,x.s.week/mx*100)+'%"></i></div>'+(x.s.week===0&&x.s.last>0?'<div class="nt" style="margin-top:4px">Not moving – avoid reordering.</div>':'')+'</div>';
  });
  return h;
}
function vItems(){
  var h='<div class="cd"><b>Add item</b><div class="grid" style="margin-top:8px"><input id="n-name" placeholder="Item name"><input id="n-unit" placeholder="Unit (kg, pack…)"><input id="n-min" type="number" inputmode="decimal" placeholder="Reorder level (optional)"><button class="pr" onclick="addItem()">Add</button></div></div>';
  h+='<div class="cd"><b>Learning settings</b><div class="grid" style="margin-top:8px"><div><label class="k">Weeks of stock to buy</label><input type="number" id="s-cw" value="'+S.set.cw+'" onchange="setS()"></div><div><label class="k">Supplier delivery days</label><input type="number" id="s-ld" value="'+S.set.ld+'" onchange="setS()"></div></div></div>';
  if(!S.items.length)h+='<div class="em">No items yet.</div>';
  S.items.forEach(function(it){
    var s=stats(it);
    h+='<div class="cd"><div class="r"><div><span class="b">'+esc(it.name)+'</span> <span class="nt">'+esc(it.unit||'')+' · '+s.n+' counts</span></div><button class="dg" onclick="delItem(\''+it.id+'\')">Delete</button></div>'
     +'<div class="r" style="margin-top:6px"><span class="nt">Your reorder level</span><input class="sm" style="width:100px" type="number" inputmode="decimal" value="'+(it.min==null?'':it.min)+'" placeholder="none" onchange="setMin(\''+it.id+'\',this.value)"></div></div>';
  });
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button onclick="csv()">Export CSV</button><button onclick="demo()">Load sample data</button><button class="dg" id="clr" onclick="clr()">Clear all</button></div>';
  return h;
}
function addItem(){
  var n=document.getElementById('n-name').value.trim();if(!n){alert('Enter an item name');return}
  S.items.push({id:'i'+Date.now()+Math.floor(Math.random()*99),name:n,unit:document.getElementById('n-unit').value.trim(),min:num(document.getElementById('n-min').value)});
  save();render();
}
function delItem(id){if(!confirm('Delete this item and its history?'))return;S.items=S.items.filter(function(x){return x.id!==id});S.counts.forEach(function(c){delete c.q[id];if(c.a)delete c.a[id]});save();render()}
function setMin(id,v){S.items.forEach(function(x){if(x.id===id)x.min=num(v)});save()}
function setS(){S.set.cw=Math.max(1,num(document.getElementById('s-cw').value)||2);S.set.ld=Math.max(0,num(document.getElementById('s-ld').value)||0);save()}
function demo(){
  var base=new Date(),ds=[];for(var i=3;i>=0;i--){var d=new Date(base.getTime()-i*7*864e5);ds.push(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2))}
  var items=[['Basmati rice','kg',20,[80,62,45,28]],['Cooking oil','L',15,[40,32,26,22]],['Sugar','kg',20,[60,52,46,38]],['Almonds','kg',5,[12,11,11,10]],['Tea packs','pack',10,[50,38,22,9]],['Salt','kg',10,[30,29,29,28]]];
  S.items=[];S.counts=ds.map(function(d){return{date:d,q:{},a:{}}});
  items.forEach(function(r,k){var id='i'+k+'d';S.items.push({id:id,name:r[0],unit:r[1],min:r[2]});r[3].forEach(function(q,j){S.counts[j].q[id]=q})});
  save();go('buy');
}
function csv(){
  var rows=[['item','unit','last_count','sold_per_week','trend','days_left','suggested_buy']].concat(all().map(function(x){return[x.it.name,x.it.unit,x.s.last,x.s.week==null?'':Math.round(x.s.week*10)/10,x.s.trend,x.s.left==null?'':Math.round(x.s.left),x.s.sug]}));
  var s=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(s);a.download='stockwise.csv';a.click();
}
var armed=false;
function clr(){var b=document.getElementById('clr');if(!armed){armed=true;b.textContent='Tap again to confirm';setTimeout(function(){armed=false;if(b)b.textContent='Clear all'},3000);return}S={items:[],counts:[],set:S.set};armed=false;save();render()}
load();render();
</script>
</body>
</html>
